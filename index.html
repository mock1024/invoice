<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Invoice 静态网站" />
    <title>Invoice</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, #d9e8ff 0, transparent 36%),
          radial-gradient(circle at bottom right, #d8f6e8 0, transparent 32%),
          #f4f7fb;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(47, 65, 95, 0.14);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #3267d6;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 42ch;
        margin: 28px 0 0;
        color: #59657a;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Simple · Clear · Ready</p>
      <h1>Invoice</h1>
      <p>这是一个通过 GitHub Pages 发布的静态网站。</p>
    </main>
  </body>
</html>
